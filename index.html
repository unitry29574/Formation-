<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<title>Technologie Invest · Formations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#eef6f0;--ink:#14231e;--mut:#55655e;--card:rgba(255,255,255,.9);--line:rgba(20,35,30,.1);--g:#12b06a;--g2:#0a8f55;--gl:#34d98f;--o:#e39a0e;--r:#e5533f;--r2:#c13a28;--sh:rgba(10,143,85,.55)}
@media(prefers-color-scheme:dark){:root{--bg:#09130f;--ink:#eef6f1;--mut:#9fb3aa;--card:rgba(20,38,32,.9);--line:rgba(255,255,255,.1);--g:#19b872;--g2:#0b8a52;--gl:#3fe39b;--o:#f4b840;--r:#f0705f;--r2:#c7483a;--sh:rgba(25,184,114,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.5 Sora,system-ui,sans-serif}
main{max-width:640px;margin:auto;padding:16px 16px 70px}
h1{font-size:26px;font-weight:800;line-height:1.2;margin:8px 0}
h2{font-size:18px;margin:0 0 6px}
p{margin:6px 0;color:var(--mut)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(165deg,#e6f8ee,#fff4de 55%,#e5f1ff)}
@media(prefers-color-scheme:dark){.bg{background:linear-gradient(165deg,#061a12,#10141f 55%,#1a1208)}}
.bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;animation:drift 16s ease-in-out infinite alternate;will-change:transform}
.bg i:nth-of-type(1){background:radial-gradient(circle,rgba(52,217,143,.55),transparent 65%);left:-24vmax;top:-22vmax}
.bg i:nth-of-type(2){background:radial-gradient(circle,rgba(255,196,64,.5),transparent 65%);right:-28vmax;top:8vh;animation-delay:-5s;animation-duration:19s}
.bg i:nth-of-type(3){background:radial-gradient(circle,rgba(76,201,240,.45),transparent 65%);left:-20vmax;bottom:-28vmax;animation-delay:-9s}
.bg i:nth-of-type(4){background:radial-gradient(circle,rgba(255,122,138,.4),transparent 65%);right:-22vmax;bottom:-24vmax;animation-delay:-3s;animation-duration:21s}
.bg b{position:absolute;bottom:-30px;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.8);animation:rise 13s linear infinite}
.bg b:nth-of-type(1){left:8%}.bg b:nth-of-type(2){left:28%;animation-delay:-4s;width:18px;height:18px}.bg b:nth-of-type(3){left:52%;animation-delay:-8s}.bg b:nth-of-type(4){left:72%;animation-delay:-2s;width:9px;height:9px}.bg b:nth-of-type(5){left:90%;animation-delay:-10s;width:16px;height:16px}
.hero{background:linear-gradient(120deg,#0a8f55,#17c47c 55%,#f2b52f);border-radius:22px;padding:22px 18px;margin:6px 0 16px;box-shadow:0 18px 30px -16px var(--sh)}
.hero h1{color:#fff;margin-top:0;text-shadow:0 2px 10px rgba(0,0,0,.18)}.hero p{color:rgba(255,255,255,.92);margin-bottom:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 12px 24px -18px rgba(0,0,0,.55);transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s}
.course{display:flex;gap:12px;align-items:center;cursor:pointer}
.course:active{transform:scale(.97)}
.course:has(input:checked){border-color:var(--g);background:linear-gradient(135deg,rgba(52,217,143,.2),var(--card));box-shadow:0 0 0 3px rgba(25,184,114,.28),0 14px 26px -16px var(--g);transform:scale(1.015)}
.course input{width:26px;height:26px;accent-color:var(--g);flex:none}
.ico{font-size:32px;flex:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.course:has(input:checked) .ico{transform:scale(1.25) rotate(-8deg)}
.price{color:var(--o);font-weight:800;white-space:nowrap;margin-left:auto;padding-left:6px}
input[type=email],input[type=password],input[type=file]{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;margin:6px 0;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--g);box-shadow:0 0 0 4px rgba(25,184,114,.25);outline:none}
button,.btn{position:relative;overflow:hidden;display:block;width:100%;text-align:center;padding:15px 18px;border:0;border-radius:18px;background:linear-gradient(180deg,var(--gl),var(--g) 45%,var(--g2));color:#fff;font:700 16px Sora,sans-serif;letter-spacing:.2px;cursor:pointer;text-decoration:none;margin:12px 0;box-shadow:0 10px 20px -8px var(--sh),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.12);text-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,filter .2s}
button:hover:not(:disabled),.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
button:active:not(:disabled),.btn:active{transform:scale(.94);box-shadow:0 3px 8px -4px var(--sh),inset 0 2px 4px rgba(0,0,0,.18);filter:brightness(.97);transition-duration:.08s}
.btn::after,#ct::after,#sd::after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-150%) skewX(-20deg);animation:shine 3.6s ease-in-out infinite;pointer-events:none}
button.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);text-shadow:none;box-shadow:0 8px 16px -10px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
button.no{background:linear-gradient(180deg,#ff8a78,var(--r) 45%,var(--r2));box-shadow:0 10px 20px -8px rgba(229,83,63,.6),inset 0 1px 0 rgba(255,255,255,.4)}
button:disabled{opacity:.55;cursor:wait;transform:scale(.98);box-shadow:none}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--o);outline-offset:3px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
.tot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:14px 0 2px}
.tot h2{color:var(--o);font-size:21px;display:inline-block}
.pop{animation:pop .3s}
.msg{padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.err{color:var(--r)}
img.proof{max-width:100%;border-radius:14px;border:1px solid var(--line)}
.row{display:flex;gap:10px}.row>*{flex:1}
summary{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}.top strong{font-size:17px;color:var(--g)}.top button{width:auto;padding:9px 16px;margin:0;font-size:14px;border-radius:14px}
.cf{position:fixed;width:8px;height:13px;border-radius:2px;z-index:99;pointer-events:none;animation:cf 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),calc(var(--dy) + 130px)) rotate(var(--r));opacity:0}}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.18)}}
@keyframes rise{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-110vh) translateX(30px);opacity:0}}
@keyframes shift{to{background-position:100% 0}}
@keyframes shine{0%,60%{transform:translateX(-150%) skewX(-20deg)}100%{transform:translateX(325%) skewX(-20deg)}}
@keyframes rip{to{transform:scale(4);opacity:0}}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.15)}}
#app>*{animation:in .2s ease-out both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bg b{display:none}}
.ld{display:flex;flex-direction:column;align-items:center;gap:6px;padding:90px 0}.sp{width:46px;height:46px;border-radius:50%;border:5px solid rgba(25,184,114,.25);border-top-color:var(--g);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main id="app"><div class="ld"><div class="sp"></div><p>Chargement…</p></div></main>

<script>
/* ===== À REMPLIR : config Firebase (Paramètres du projet > Vos applications > Web) ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyBAGXXla0nAXhQwJr16aRyQU9TCPfpi88c",authDomain:"formation-2511b.firebaseapp.com",projectId:"formation-2511b",appId:"1:874261439478:web:b6b9a9971414d5fce6ddd7"};
const ADMIN_EMAIL="msourabi610@gmail.com";
const PAY="https://pay.jeko.africa/pl/b0b8758e-0d42-4282-bed4-1e802b406d5d";

/* ===== Formations : modifie prix, liens et leçons ici. Un lien Jeko = un montant, crée un lien par prix. ===== */
const COURSES=[
{id:"ia",title:"Créer des vidéos avec l'IA",price:8000,link:PAY,desc:"Vidéo pas à pas : comment créer une vidéo avec l'IA.",media:{type:"video/mp4",label:"Vidéo : créer une vidéo avec l'IA"}},
{id:"tiktok",title:"Monétiser son compte TikTok légalement",price:10000,link:PAY,desc:"Vidéo de 8 minutes : monétiser ton compte TikTok dans le respect des règles.",media:{type:"video/mp4",label:"Vidéo : monétiser TikTok"}},
{id:"youtube",title:"Monétiser une chaîne YouTube",price:12000,link:PAY,desc:"Vidéo : comment monétiser un compte YouTube.",media:{type:"video/mp4",label:"Vidéo : monétiser YouTube"}},
{id:"site",title:"Créer une plateforme gratuitement avec ChatGPT",price:25000,link:PAY,desc:"Guide PDF pas à pas, avec tous les messages à copier-coller.",media:{type:"application/pdf",label:"Guide PDF : créer ta plateforme"}}
];

const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id), app=$("app");
const LD='<div class="ld"><div class="sp"></div><p>Chargement…</p></div>';app.innerHTML=LD;
const slow=()=>setTimeout(()=>{const p=app.querySelector(".ld p");if(p)p.textContent="Connexion lente, encore un instant…"},4000);slow();
document.body.insertAdjacentHTML("afterbegin",'<div class="bg" aria-hidden="true"><i></i><i></i></div>');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n.toLocaleString("fr-FR")+" FCFA";
const byId=id=>COURSES.find(c=>c.id===id);
let sel=new Set(),mode="login";
const ICO={ia:"🎬",tiktok:"🎵",youtube:"▶️",site:"🌐"};
function burst(x,y,n){const C=["#17a463","#f0b23a","#4cc9f0","#ff7a8a","#a78bfa"];for(let i=0;i<n;i++){const e=document.createElement("i");e.className="cf";const a=Math.random()*6.28,d=50+Math.random()*130;e.style.cssText=`left:${x}px;top:${y}px;background:${C[i%5]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-50}px;--r:${Math.random()*720-360}deg`;document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}}
let ac;function tick(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=520;g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.08);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.08)}catch(e){}}
document.addEventListener("pointerdown",e=>{const b=e.target.closest("button:not(:disabled),.btn,label.course");if(!b)return;if(navigator.vibrate)navigator.vibrate(10);setTimeout(tick,0);if(b.tagName==="LABEL")return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)/4,x=document.createElement("span");x.className="rip";x.style.cssText=`width:${d*2}px;height:${d*2}px;left:${e.clientX-r.left-d}px;top:${e.clientY-r.top-d}px`;b.appendChild(x);setTimeout(()=>x.remove(),500)});

let rk="",shown=false,S=null,poll=null;
const KEY=FIREBASE_CONFIG.apiKey,FS="https://firestore.googleapis.com/v1/projects/"+FIREBASE_CONFIG.projectId+"/databases/(default)/documents";
const CK="ord",cacheGet=()=>{try{return JSON.parse(LS.get(CK))}catch(e){return null}};
const cacheSet=(u,o)=>LS.set(CK,JSON.stringify(o?{uid:u.uid,email:u.email,status:o.status,courses:o.courses,total:o.total}:{uid:u.uid,email:u.email,status:"none"}));
const saveS=()=>LS.set("ses",S?JSON.stringify(S):"");
/* --- réseau : une seule fonction, délai max 30 s --- */
async function jf(url,o){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),30000);
  try{const r=await fetch(url,{...o,signal:c.signal}),j=r.status===204?{}:await r.json().catch(()=>({}));
    if(!r.ok){const m=(j.error&&(j.error.message||j.error.status))||"HTTP "+r.status;throw Object.assign(new Error(m),{status:r.status})}return j}
  catch(e){if(!e.status)e.code=e.name==="AbortError"?"timeout":"network";throw e}finally{clearTimeout(t)}}
const AUTH=(p,b)=>jf("https://identitytoolkit.googleapis.com/v1/accounts:"+p+"?key="+KEY,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...b,returnSecureToken:true})});
function setS(r){S={uid:r.localId,email:r.email,rt:r.refreshToken,id:r.idToken,exp:Date.now()+(+r.expiresIn-60)*1000};saveS()}
async function tok(){
  if(Date.now()<S.exp)return S.id;
  const r=await jf("https://securetoken.googleapis.com/v1/token?key="+KEY,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(S.rt)});
  S.id=r.id_token;S.rt=r.refresh_token;S.exp=Date.now()+(+r.expires_in-60)*1000;saveS();return S.id}
/* --- base de données (API REST Firestore) --- */
const enc=v=>typeof v==="string"?{stringValue:v}:Array.isArray(v)?{arrayValue:{values:v.map(enc)}}:{integerValue:String(v)};
const dec=f=>"stringValue"in f?f.stringValue:"integerValue"in f?+f.integerValue:"arrayValue"in f?(f.arrayValue.values||[]).map(dec):null;
const fromDoc=d=>{const o={};for(const k in d.fields||{})o[k]=dec(d.fields[k]);return o};
const toFields=o=>{const f={};for(const k in o)f[k]=enc(o[k]);return{fields:f}};
async function fs(path,method,body,mask){
  const q=mask?"?"+mask.map(m=>"updateMask.fieldPaths="+m).join("&"):"";
  return jf(FS+path+q,{method:method||"GET",headers:{Authorization:"Bearer "+await tok(),"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined})}
async function getOrder(uid){try{const o=fromDoc(await fs("/orders/"+uid));return o}catch(e){if(e.status===404&&!/database/i.test(e.message))return null;throw e}}
async function pending(){
  const r=await jf(FS+":runQuery",{method:"POST",headers:{Authorization:"Bearer "+await tok(),"Content-Type":"application/json"},body:JSON.stringify({structuredQuery:{from:[{collectionId:"orders"}],where:{fieldFilter:{field:{fieldPath:"status"},op:"EQUAL",value:{stringValue:"pending"}}}}})});
  return r.filter(x=>x.document).map(x=>({id:x.document.name.split("/").pop(),...fromDoc(x.document)}))}
/* --- messages clairs --- */
function hint(e){const m=e.message||"";
  return(/database.*does not exist/i.test(m)?"La base Firestore (default) n'existe pas encore : crée-la dans Firebase.":e.status===403?"Accès refusé : publie les règles de sécurité Firestore (ou vérifie que l'API Firestore est active).":e.code==="timeout"||e.code==="network"?"Réseau trop lent ou bloqué. Réessaie.":"Erreur")+" ("+m.slice(0,110)+")"}
function fail(e){rk="";app.innerHTML=`<h1>Oups</h1><p class="err">${esc(hint(e))}</p><button onclick="sync()">Réessayer</button><button class="alt" onclick="out()">Me déconnecter</button>`}
const out=()=>{clearInterval(poll);S=null;saveS();LS.set(CK,"");rk="";shown=false;showAuth()};
const head=()=>`<div class="top"><strong>Technologie Invest</strong><button class="alt" onclick="out()">Déconnexion</button></div>`;
/* --- synchronisation : une lecture au départ, puis toutes les 8 s seulement si on attend une validation (ou si admin) --- */
async function sync(){
  if(!S)return;
  try{
    if(S.email===ADMIN_EMAIL)showAdmin(S,await pending());else{const o=await getOrder(S.uid);cacheSet(S,o);route(S,o)}
    clearInterval(poll);if(S.email===ADMIN_EMAIL||rk.startsWith("pending"))poll=setInterval(()=>document.hidden||sync(),8000)
  }catch(e){
    if(/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED|INVALID_GRANT/.test(e.message)){out();return}
    if(!app.firstElementChild||app.querySelector(".ld"))fail(e)}}

function showAuth(){
  const login=mode==="login";
  app.innerHTML=`<div class="hero"><h1>Apprends des compétences qui rapportent</h1><p>IA, TikTok, YouTube, création de plateforme. Choisis ta formation après ton inscription.</p></div>
  <div class="card"><h2>${login?"Connexion":"Inscription"}</h2>
  <input id="em" type="email" placeholder="Adresse Gmail" autocomplete="email">
  <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="${login?"current-password":"new-password"}">
  <p id="er" class="err"></p>
  <button id="go">${login?"Se connecter":"Créer mon compte"}</button>
  <button class="alt" id="sw">${login?"Pas de compte ? S'inscrire":"J'ai déjà un compte"}</button></div>`;
  $("sw").onclick=()=>{mode=login?"signup":"login";showAuth()};
  $("go").onclick=async()=>{
    const e=$("em").value.trim(),p=$("pw").value,b=$("go"),lab=login?"Se connecter":"Créer mon compte";
    b.disabled=true;b.textContent="Un instant…";
    try{
      setS(await AUTH(login?"signInWithPassword":"signUp",{email:e,password:p}));rk="";shown=false;
      if(login){app.innerHTML=LD;slow();sync()}else{rk="none";showCatalogue(S)}
    }catch(x){const m=x.message||"";
      $("er").textContent=/EMAIL_EXISTS/.test(m)?"Cet email a déjà un compte. Connecte-toi.":/WEAK_PASSWORD/.test(m)?"Mot de passe trop court (6 caractères minimum).":/INVALID_EMAIL|MISSING_EMAIL/.test(m)?"Adresse email invalide.":/INVALID_LOGIN|INVALID_PASSWORD|EMAIL_NOT_FOUND|MISSING_PASSWORD/.test(m)?"Email ou mot de passe incorrect.":x.code?"Réseau trop lent ou bloqué. Réessaie.":"Erreur : "+m;
      b.disabled=false;b.textContent=lab}
  };
}

function route(u,o){
  const k=o?o.status+"|"+o.courses.join()+"|"+o.total+"|"+(o.proof?1:0):"none";
  if(k===rk&&app.firstElementChild&&!app.querySelector(".ld"))return;/* rien n'a changé : pas de re-dessin */
  rk=k;
  if(!o) return showCatalogue(u);
  if(o.status==="approved") return showLearn(u,o);
  if(o.status==="pending") return showWait(u,o);
  showPay(u,o);
}

function showCatalogue(u){
  app.innerHTML=head()+`<h1>Choisis tes formations</h1><p>Plus la formation est avancée, plus le prix augmente. Tu peux en prendre plusieurs.</p>`+
  COURSES.map(c=>`<label class="card course"><input type="checkbox" value="${c.id}" ${sel.has(c.id)?"checked":""}><span class="ico">${ICO[c.id]||"📘"}</span><div><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p></div><span class="price">${fmt(c.price)}</span></label>`).join("")+
  `<div class="tot"><h2 id="tt"></h2><button id="ct">Continuer vers le paiement</button></div>`;
  const upd=()=>{const e=$("tt");e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop");const t=[...sel].reduce((a,i)=>a+byId(i).price,0);$("tt").textContent="Total : "+fmt(t);$("ct").disabled=!sel.size};
  app.querySelectorAll("input[type=checkbox]").forEach(i=>i.onchange=()=>{if(i.checked){sel.add(i.value);const r=i.getBoundingClientRect();burst(r.left+13,r.top+13,12)}else sel.delete(i.value);upd()});
  upd();
  $("ct").onclick=async()=>{
    const b=$("ct"),courses=[...sel],total=courses.reduce((a,i)=>a+byId(i).price,0);
    b.disabled=true;b.textContent="Un instant…";
    try{await fs("/orders/"+u.uid,"PATCH",toFields({uid:u.uid,email:u.email,courses,total,status:"awaiting",createdAt:Date.now()}));await sync()}
    catch(e){b.disabled=false;b.textContent="Continuer vers le paiement";alert(hint(e))}
  };
}

function showPay(u,o){
  const link=o.courses.length===1?byId(o.courses[0]).link:PAY;
  app.innerHTML=head()+`<h1>Paiement</h1>
  ${o.status==="rejected"?`<p class="msg err">Ta preuve a été refusée. Vérifie ton paiement et envoie une nouvelle capture d'écran.</p>`:""}
  <div class="card"><h2>${o.courses.map(i=>esc(byId(i).title)).join("<br>")}</h2><h2 style="color:var(--o)">Total : ${fmt(o.total)}</h2></div>
  <div class="card"><p><strong>1.</strong> Veuillez payer pour Technologie Invest en cliquant sur le lien ci-dessous.</p>
  <a class="btn" href="${esc(link)}" target="_blank" rel="noopener">Payer ${fmt(o.total)}</a>
  <p><strong>2.</strong> Reviens ici et envoie la capture d'écran de ton paiement.</p>
  <input type="file" id="fl" accept="image/*"><p id="er" class="err"></p>
  <button id="sd">Envoyer la preuve</button></div>
  <button class="alt" id="ch">Changer mes formations</button>`;
  $("ch").onclick=()=>{sel=new Set(o.courses);fs("/orders/"+u.uid,"DELETE").then(sync)};
  $("sd").onclick=async()=>{
    const f=$("fl").files[0];if(!f){$("er").textContent="Choisis d'abord ta capture d'écran.";return}
    $("sd").disabled=true;
    try{const proof=await shrink(f);await fs("/orders/"+u.uid,"PATCH",toFields({proof,status:"pending",sentAt:Date.now()}),["proof","status","sentAt"]);await sync()}
    catch(e){$("er").textContent="Envoi impossible : "+e.message;$("sd").disabled=false}
  };
}
function shrink(f){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6))};i.onerror=()=>ko(new Error("image illisible"));i.src=URL.createObjectURL(f)})}

function showWait(u,o){
  app.innerHTML=head()+`<h1>Preuve envoyée</h1><p class="msg">L'administrateur vérifie ton paiement. Reviens plus tard : ton accès s'ouvrira dès la validation.</p>${o.proof?`<img class="proof" src="${o.proof}" alt="Ta capture d'écran">`:""}`;
}

const CH=600*1024,MC={};
function b64(buf){let s="";const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)}
const unb64=s=>{const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a};
const cid=i=>String(i).padStart(4,"0");
async function uploadMedia(id,file,cb){
  const old=await fs("/media/"+id+"/chunks?pageSize=300&mask.fieldPaths=z").catch(()=>({}));
  for(const d of old.documents||[])await fs("/media/"+id+"/chunks/"+d.name.split("/").pop(),"DELETE");
  const n=Math.ceil(file.size/CH);
  for(let i=0;i<n;i++){const buf=await file.slice(i*CH,(i+1)*CH).arrayBuffer();await fs("/media/"+id+"/chunks/"+cid(i),"PATCH",toFields({d:b64(buf)}));cb(i+1,n)}
  await fs("/media/"+id,"PATCH",toFields({n,size:file.size}));
}
async function loadMedia(id,type,cb){
  let m;try{m=fromDoc(await fs("/media/"+id))}catch(e){if(e.status===404)throw new Error("Ce contenu n'est pas encore disponible.");throw e}
  const n=m.n,parts=[],W=6;
  for(let i=0;i<n;i+=W){
    const ds=await Promise.all([...Array(Math.min(W,n-i)).keys()].map(k=>fs("/media/"+id+"/chunks/"+cid(i+k))));
    ds.forEach(d=>parts.push(unb64(d.fields.d.stringValue)));cb(Math.min(i+W,n),n);
  }
  return URL.createObjectURL(new Blob(parts,{type}));
}
const mhtml=(c,url)=>c.media.type==="application/pdf"
  ?`<a class="btn" href="${url}" download="${esc(c.id)}.pdf">Télécharger le guide PDF</a>`
  :`<video controls playsinline preload="metadata" style="width:100%;max-height:70vh;border-radius:12px;background:#000" src="${url}"></video><a class="btn" href="${url}" download="${esc(c.id)}.mp4">Télécharger la vidéo</a>`;
function wire(root){root.querySelectorAll("button[data-open]").forEach(b=>b.onclick=async()=>{
  const c=byId(b.dataset.open),box=$("m-"+c.id);box.innerHTML=`<p id="pg-${c.id}">Chargement 0%</p>`;
  try{
    const url=MC[c.id]||(MC[c.id]=await loadMedia(c.id,c.media.type,(a,n)=>{const e=$("pg-"+c.id);if(e)e.textContent="Chargement "+Math.round(a/n*100)+"%"}));
    box.innerHTML=mhtml(c,url);
  }catch(e){delete MC[c.id];box.innerHTML=`<p class="err">${esc(e.message)}</p><button data-open="${c.id}">Réessayer</button>`;wire(box)}
})}
function showLearn(u,o){if(!window._cf){window._cf=1;burst(innerWidth/2,innerHeight*.25,44)}
  app.innerHTML=head()+`<h1>Mes formations</h1>`+o.courses.map(i=>{const c=byId(i);return c?`<div class="card"><h2>${esc(c.title)}</h2><p>${esc(c.media.label)}</p><div id="m-${c.id}"><button data-open="${c.id}">Ouvrir</button></div></div>`:""}).join("");
  wire(app);
  o.courses.forEach(i=>{if(byId(i)&&MC[i])$("m-"+i).innerHTML=mhtml(byId(i),MC[i])});/* déjà téléchargé : réaffichage instantané */
}

function showAdmin(u,list){
  if(!$("adm")){
    app.innerHTML=head()+`<div id="adm"></div><details><summary class="card"><b>Contenus des formations</b> (à envoyer une seule fois)</summary><p>Choisis chaque vidéo ou PDF dans ton téléphone. Ils sont protégés : seuls les élèves validés les voient.</p>`+
    COURSES.map(c=>`<div class="card"><h2>${esc(c.media.label)}</h2><input type="file" id="f-${c.id}" accept="${c.media.type==="application/pdf"?"application/pdf":"video/mp4,video/*"}"><button data-up="${c.id}">Envoyer</button><p id="s-${c.id}"></p></div>`).join("")+"</details>";
    app.querySelectorAll("button[data-up]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.up,f=$("f-"+id).files[0],st=$("s-"+id);if(!f){st.textContent="Choisis un fichier.";return}
      b.disabled=true;
      try{await uploadMedia(id,f,(a,n)=>st.textContent="Envoi "+Math.round(a/n*100)+"%");st.textContent="Envoyé."}
      catch(e){st.textContent="Erreur : "+e.message}
      b.disabled=false;
    });
    COURSES.forEach(c=>fs("/media/"+c.id).then(()=>{$("s-"+c.id).textContent="✅ Déjà envoyé"}).catch(()=>{}));
  }
  $("adm").innerHTML=`<h1>Preuves à valider (${list.length})</h1>`+(list.length?"":`<p>Aucune preuve en attente.</p>`)+
  list.map(o=>`<div class="card"><h2>${esc(o.email)}</h2><p>${o.courses.map(i=>esc(byId(i)?.title||i)).join(", ")}<br><strong>${fmt(o.total)}</strong></p>
  <img class="proof" src="${o.proof}" alt="Preuve de ${esc(o.email)}"><div class="row"><button data-a="approved" data-id="${o.id}">Valider</button><button class="no" data-a="rejected" data-id="${o.id}">Refuser</button></div></div>`).join("");
  $("adm").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>fs("/orders/"+b.dataset.id,"PATCH",toFields({status:b.dataset.a}),["status"]).then(sync));
}
